      "    {\n"
      "      \"id\": \"rs_0da9873fe0d86f6f016ae2edc9117c87d19bcbb8c6e1e30a61\",\n"
      "      \"type\": \"reasoning\",\n"
      "      \"summary\": [],\n"
      "      \"encrypted_content\": \"gAAAAABq4u3J…\",\n"
      "      \"status\": \"completed\"\n"
      "    },\n"
      "    {\n"
      "      \"id\": \"msg_1793256905558_0\",\n"
      "      \"type\": \"message\",\n"
      "      \"status\": \"completed\",\n"
      "      \"role\": \"assistant\",\n"
      "      \"phase\": null,\n"
      "      \"content\": [{\"type\": \"output_text\", \"text\": \"391\", \"annotations\": [], \"logprobs\": []}]\n"
      "    }\n"
      "  ],\n"
      "  \"background\": false,\n"
      "  \"conversation\": null,\n"
      "  \"instructions\": null,\n"
      "  \"max_output_tokens\": 3000,\n"
