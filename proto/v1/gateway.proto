      "    \"cost_rub\": 0.0051\n"
      "  }\n"
      "}"
  }};

  // Идентификатор ответа.
  string id = 1;
  // Тип объекта. Значение: response.
  string object = 2;
  // Время создания ответа в секундах Unix.
  int64 created_at = 3 [(openapi.v3.property) = {type: "integer" format: "int64"}];
  // Время завершения ответа в секундах Unix. Для незавершённого ответа null.
  int64 completed_at = 4 [(openapi.v3.property) = {type: "integer" format: "int64" nullable: true}];
  // Статус ответа: completed, incomplete, failed или in_progress.
  string status = 5;
  // Идентификатор модели, обработавшей запрос.
  string model = 7;
  // Системные инструкции, применённые к запросу.
  string instructions = 8 [(openapi.v3.property) = {nullable: true}];
  // Применённый лимит токенов ответа.
  int32 max_output_tokens = 9 [(openapi.v3.property) = {nullable: true}];
  // Всегда false: ответ формируется синхронно.
  bool background = 10;
  // Всегда false: ответы не хранятся.
  bool store = 11;
}

message EmbeddingRequest {
  option (openapi.v3.schema) = {
    properties: {
      additional_properties: {name: "input" value: {schema: {description: "Текст для создания эмбеддинга: строка или массив строк. Если модель поддерживает готовые токены, можно передать массив их идентификаторов или массив таких массивов." example: {yaml: "'Как восстановить пароль от панели управления Beget?'"}}}}
    }
    required: "input"
    example: {yaml:
      "{\n"
      "  \"model\": \"text-embedding-3-small\",\n"
      "  \"input\": \"Как восстановить пароль от панели управления Beget?\",\n"
      "  \"encoding_format\": \"float\",\n"
      "  \"dimensions\": 8\n"
      "}"
  }};

  // Идентификатор модели эмбеддингов из списка доступных моделей.
  string model = 1 [(google.api.field_behavior) = REQUIRED, (openapi.v3.property) = {example: {yaml: "text-embedding-3-small"}}];
  // Формат эмбеддинга: float - массив чисел, base64 - строка в кодировке Base64.
  string encoding_format = 3;
  // Количество чисел в эмбеддинге. Возможность изменить размерность зависит от модели.
  int32 dimensions = 4;
}

message EmbeddingResponse {
  option (openapi.v3.schema) = {example: {yaml:
    "{\n"
    "  \"data\": [\n"
    "    {\n"
    "      \"embedding\": [\n"
    "        0.2181396484375,\n"
    "        0.340576171875,\n"
    "        -0.2415771484375,\n"
    "        0.0113983154296875,\n"
    "        -0.24951171875,\n"
    "        0.322021484375,\n"
    "        -0.440185546875,\n"
    "        0.646484375\n"
    "      ],\n"
    "      \"index\": 0,\n"
    "      \"object\": \"embedding\"\n"
    "    }\n"
    "  ],\n"
    "  \"model\": \"text-embedding-3-small\",\n"
    "  \"object\": \"list\",\n"
    "  \"usage\": {\n"
    "    \"cost_rub\": 5.4e-05,\n"
    "    \"input_price_per_1m_rub\": 3,\n"
    "    \"prompt_tokens\": 18,\n"
    "    \"total_tokens\": 18\n"
    "  }\n"
    "}"
  }};

  // Тип объекта. Значение: list.
  string object = 1;
  // Эмбеддинги для переданных текстов.
  repeated Embedding data = 2;
  // Идентификатор модели, обработавшей запрос.
  string model = 3;
  // Статистика использования токенов и стоимость запроса в рублях.
  beget.llm_gateway.v1.structures.TokenUsage usage = 4;

  message Embedding {
    option (openapi.v3.schema) = {
      properties: {
        additional_properties: {name: "embedding" value: {schema: {description: "Вектор в формате, заданном параметром encoding_format: массив чисел для float или строка Base64 для base64."}}}
      }
    };

    // Тип объекта. Значение: embedding.
    string object = 1;
    // Индекс текста в запросе, начиная с нуля.
    int32 index = 2;
  }
}

