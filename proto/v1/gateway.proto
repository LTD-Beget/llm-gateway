syntax = "proto3";

package beget.llm_gateway.v1.gateway;

import "google/api/annotations.proto";
import "google/api/field_behavior.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/struct.proto";
import "openapiv3/annotations.proto";
import "proto/v1/structures.proto";

option go_package = "github.com/LTD-Beget/llm-gateway/proto/v1;llmgateway";

option (openapi.v3.document) = {
  info: {
    title: "ИИ шлюз"
    version: "v1"
    description: "Для работы с текстовыми моделями используйте Chat Completions API. Responses API не поддерживается."
  }
  servers: {url: "https://api-llm.beget.com/v1"}
  external_docs: {url: "https://beget.com/ru/kb/manual/ai-gateway" description: "Руководство по ИИ шлюзу"}
  tags: {name: "Генерация ответов" description: "Генерация ответов модели на основе переданных сообщений."}
  tags: {name: "Эмбеддинги" description: "Векторные представления текста для поиска по смыслу и сравнения текстов."}
  tags: {name: "Модели" description: "Информация о моделях, доступных вашему API-ключу."}
  security: {additional_properties: {name: "BearerAuth" value: {value: []}}}
  components: {
    security_schemes: {additional_properties: {
      name: "BearerAuth"
      value: {security_scheme: {type: "http" scheme: "bearer" description: "API-ключ ИИ шлюза Beget"}}
    }}
    responses: {additional_properties: {
      name: "GatewayError"
      value: {response: {
        description: "Возвращает описание ошибки в поле `error`.\n\n"
          "- `400` - некорректные параметры запроса.\n"
          "- `401` - API-ключ недействителен или отключён.\n"
          "- `402` - недостаточно средств на балансе или исчерпан бюджет ключа.\n"
          "- `404` - модель не найдена или недоступна ключу.\n"
          "- `409` - конфликт идемпотентности.\n"
          "- `429` - превышен лимит запросов.\n"
          "- `5xx` - ошибка шлюза или поставщика модели."
        content: {additional_properties: {
          name: "application/json"
          value: {
            schema: {schema: {
              type: "object"
              properties: {additional_properties: {
                name: "error"
                value: {schema: {
                  type: "object"
                  properties: {
                    additional_properties: {name: "message" value: {schema: {type: "string"}}}
                    additional_properties: {name: "type" value: {schema: {type: "string"}}}
                    additional_properties: {name: "param" value: {schema: {type: "string" nullable: true}}}
                    additional_properties: {name: "code" value: {schema: {type: "string"}}}
                  }
                }}
              }}
            }}
            example: {yaml: "{error: {message: 'invalid api key', type: invalid_request_error, param: null, code: invalid_api_key}}"}
          }
        }}
      }}
    }}
  }
};

// Обрабатывает запросы к моделям в формате OpenAI API.
service LlmGatewayService {
  // Генерирует ответ модели на основе переданных сообщений.
  //
  // Передавайте историю диалога в поле `messages`. Возможности модели определяют,
  // какие типы сообщений, параметры генерации и инструменты можно использовать.
  //
  // По умолчанию возвращает ответ целиком в JSON. При `stream: true` передаёт ответ
  // по частям в формате `text/event-stream` (SSE). Поток завершается событием `data: [DONE]`.
  // Схема ответа описывает режим без потоковой передачи.
  rpc createChatCompletion(ChatCompletionRequest) returns (ChatCompletionResponse) {
    option (google.api.http) = {post: "/chat/completions" body: "*"};
    option (openapi.v3.operation) = {
      tags: "Генерация ответов"
      operation_id: "createChatCompletion"
      summary: "Сгенерировать ответ"
      responses: {default: {reference: {_ref: "#/components/responses/GatewayError"}}}
    };
  }

  // Создаёт эмбеддинги для переданного текста.
  //
  // Эмбеддинг представляет текст в виде массива чисел. Его можно использовать для поиска
  // по смыслу и сравнения текстов. Для запроса и документов выбирайте одну и ту же модель.
  // В примере `dimensions: 8` задаёт вектор из восьми чисел.
  rpc createEmbedding(EmbeddingRequest) returns (EmbeddingResponse) {
    option (google.api.http) = {post: "/embeddings" body: "*"};
    option (openapi.v3.operation) = {
      tags: "Эмбеддинги"
      operation_id: "createEmbedding"
      summary: "Создать эмбеддинги"
      responses: {default: {reference: {_ref: "#/components/responses/GatewayError"}}}
    };
  }

  // Возвращает список моделей, доступных вашему API-ключу.
  //
  // Используйте идентификатор из поля `id` в параметре `model` при генерации ответа
  // или создании эмбеддингов. Список зависит от ограничений API-ключа.
  rpc listModels(google.protobuf.Empty) returns (ListModelsResponse) {
    option (google.api.http) = {get: "/models"};
    option (openapi.v3.operation) = {
      tags: "Модели"
      operation_id: "listModels"
      summary: "Получить список моделей"
      responses: {default: {reference: {_ref: "#/components/responses/GatewayError"}}}
    };
  }

  // Возвращает информацию о модели по её идентификатору.
  // Модель должна быть доступна вашему API-ключу.
  rpc getModel(GetModelRequest) returns (beget.llm_gateway.v1.structures.Model) {
    option (google.api.http) = {get: "/models/{model}"};
    option (openapi.v3.operation) = {
      tags: "Модели"
      operation_id: "getModel"
      summary: "Получить информацию о модели"
      responses: {default: {reference: {_ref: "#/components/responses/GatewayError"}}}
    };
  }
}

message ChatCompletionRequest {
  option (openapi.v3.schema) = {example: {yaml:
    "{\n"
    "  \"model\": \"gemini-3.1-flash-lite\",\n"
    "  \"messages\": [\n"
    "    {\n"
    "      \"role\": \"system\",\n"
    "      \"content\": \"Ты редактор интернет-магазина. Напиши ровно одно короткое предложение, не более 20 слов. Без вступления, вариантов и форматирования.\"\n"
    "    },\n"
    "    {\n"
    "      \"role\": \"user\",\n"
    "      \"content\": \"Описание товара: белая керамическая кружка, 350 мл, можно мыть в посудомоечной машине.\"\n"
    "    }\n"
    "  ],\n"
    "  \"max_tokens\": 128\n"
    "}"
  }};

  // Идентификатор модели. Доступные значения возвращает метод «Получить список моделей».
  string model = 1 [(google.api.field_behavior) = REQUIRED, (openapi.v3.property) = {example: {yaml: "gemini-3.1-flash-lite"}}];
  // Список сообщений диалога. Должен содержать хотя бы одно сообщение.
  repeated beget.llm_gateway.v1.structures.ChatMessage messages = 2 [(google.api.field_behavior) = REQUIRED, (openapi.v3.property) = {min_items: 1}];
  // Если true, передаёт ответ по частям в формате SSE. По умолчанию false.
  optional bool stream = 3 [(openapi.v3.property) = {example: {yaml: "false"}}];
  // Максимальное количество токенов в ответе модели. Поддержка зависит от модели.
  optional int32 max_tokens = 4;
  // Максимальное количество токенов ответа, включая токены рассуждений. Поддержка зависит от модели.
  optional int32 max_completion_tokens = 5;
  // Степень случайности ответа: при меньшем значении модель выбирает более предсказуемые продолжения. Диапазон зависит от модели.
  optional double temperature = 6;
  // Доля суммарной вероятности, в пределах которой модель выбирает следующий токен. Например, 0.1 ограничивает выбор наиболее вероятными токенами с общей вероятностью 10%.
  optional double top_p = 7;
  // Количество вариантов ответа. Поддержка зависит от модели.
  optional int32 n = 8;
  // Строка или массив строк, при появлении которых генерация ответа прекращается.
  google.protobuf.Value stop = 9;
  // Требуемый формат ответа, например {"type":"json_object"} для JSON. Поддержка зависит от модели.
  google.protobuf.Struct response_format = 10;
  // Описания инструментов, которые может вызвать модель. Для функции укажите type: function и объект function с именем, описанием и схемой параметров.
  repeated google.protobuf.Struct tools = 11;
  // Режим вызова инструментов: none, auto, required или объект с именем конкретной функции. Поддержка зависит от модели.
  google.protobuf.Value tool_choice = 12;
  // Разрешает модели вызывать несколько инструментов параллельно. Поддержка зависит от модели.
  optional bool parallel_tool_calls = 13;
  // Параметры потокового ответа. Например, {"include_usage":true} добавляет статистику использования токенов. Используется вместе со stream: true.
  google.protobuf.Struct stream_options = 14;
}

message ChatCompletionResponse {
  option (openapi.v3.schema) = {example: {yaml:
    "{\n"
    "  \"id\": \"gen_2224184511775248385\",\n"
    "  \"object\": \"chat.completion\",\n"
    "  \"created\": 1792590913,\n"
    "  \"model\": \"gemini-3.1-flash-lite\",\n"
    "  \"choices\": [\n"
    "    {\n"
    "      \"index\": 0,\n"
    "      \"message\": {\n"
    "        \"role\": \"assistant\",\n"
    "        \"content\": \"Классическая белая кружка объемом 350 мл подходит для мытья в посудомоечной машине.\"\n"
    "      },\n"
    "      \"finish_reason\": \"stop\"\n"
    "    }\n"
    "  ],\n"
    "  \"usage\": {\n"
    "    \"cache_write_price_per_1m_rub\": 10,\n"
    "    \"cached_price_per_1m_rub\": 3,\n"
    "    \"completion_tokens\": 25,\n"
    "    \"completion_tokens_details\": {\n"
    "      \"audio_tokens\": 0,\n"
    "      \"reasoning_tokens\": 0\n"
    "    },\n"
    "    \"cost_rub\": 0.00632,\n"
    "    \"input_price_per_1m_rub\": 30,\n"
    "    \"output_price_per_1m_rub\": 176,\n"
    "    \"prompt_tokens\": 64,\n"
    "    \"prompt_tokens_details\": {\n"
    "      \"audio_tokens\": 0,\n"
    "      \"cache_write_tokens\": 0,\n"
    "      \"cached_tokens\": 0\n"
    "    },\n"
    "    \"total_tokens\": 89\n"
    "  }\n"
    "}"
  }};

  // Идентификатор ответа.
  string id = 1;
  // Тип объекта. Значение: chat.completion.
  string object = 2;
  // Время создания ответа в секундах Unix.
  int64 created = 3 [(openapi.v3.property) = {type: "integer" format: "int64"}];
  // Идентификатор модели, обработавшей запрос.
  string model = 4;
  // Варианты ответа модели.
  repeated Choice choices = 5;
  // Статистика использования токенов и стоимость запроса в рублях.
  beget.llm_gateway.v1.structures.TokenUsage usage = 6;

  message Choice {
    // Индекс варианта ответа, начиная с нуля.
    int32 index = 1;
    // Сообщение модели. Содержит текст в content, вызовы инструментов в tool_calls и рассуждения в reasoning_content, если они присутствуют в ответе.
    google.protobuf.Struct message = 2;
    // Причина завершения: stop - ответ завершён, length - достигнут лимит токенов, tool_calls - модель запросила вызов инструмента.
    optional string finish_reason = 3;
  }
}

message EmbeddingRequest {
  option (openapi.v3.schema) = {example: {yaml:
    "{\n"
    "  \"model\": \"text-embedding-3-small\",\n"
    "  \"input\": \"Как восстановить пароль от панели управления Beget?\",\n"
    "  \"encoding_format\": \"float\",\n"
    "  \"dimensions\": 8\n"
    "}"
  }};

  // Идентификатор модели эмбеддингов из списка доступных моделей.
  string model = 1 [(google.api.field_behavior) = REQUIRED, (openapi.v3.property) = {example: {yaml: "text-embedding-3-small"}}];
  // Текст для создания эмбеддинга: строка или массив строк. Если модель поддерживает готовые токены, можно передать массив их идентификаторов или массив таких массивов.
  google.protobuf.Value input = 2 [(google.api.field_behavior) = REQUIRED, (openapi.v3.property) = {example: {yaml: "'Как восстановить пароль от панели управления Beget?'"}}];
  // Формат эмбеддинга: float - массив чисел, base64 - строка в кодировке Base64.
  optional string encoding_format = 3 [(openapi.v3.property) = {enum: {yaml: "float"} enum: {yaml: "base64"}}];
  // Количество чисел в эмбеддинге. Возможность изменить размерность зависит от модели.
  optional int32 dimensions = 4;
}

message EmbeddingResponse {
  option (openapi.v3.schema) = {example: {yaml:
    "{\n"
    "  \"data\": [\n"
    "    {\n"
    "      \"embedding\": [\n"
    "        0.2181396484375,\n"
    "        0.340576171875,\n"
    "        -0.2415771484375,\n"
    "        0.0113983154296875,\n"
    "        -0.24951171875,\n"
    "        0.322021484375,\n"
    "        -0.440185546875,\n"
    "        0.646484375\n"
    "      ],\n"
    "      \"index\": 0,\n"
    "      \"object\": \"embedding\"\n"
    "    }\n"
    "  ],\n"
    "  \"model\": \"text-embedding-3-small\",\n"
    "  \"object\": \"list\",\n"
    "  \"usage\": {\n"
    "    \"cost_rub\": 5.4e-05,\n"
    "    \"input_price_per_1m_rub\": 3,\n"
    "    \"prompt_tokens\": 18,\n"
    "    \"total_tokens\": 18\n"
    "  }\n"
    "}"
  }};

  // Тип объекта. Значение: list.
  string object = 1;
  // Эмбеддинги для переданных текстов.
  repeated Embedding data = 2;
  // Идентификатор модели, обработавшей запрос.
  string model = 3;
  // Статистика использования токенов и стоимость запроса в рублях.
  beget.llm_gateway.v1.structures.TokenUsage usage = 4;

  message Embedding {
    // Тип объекта. Значение: embedding.
    string object = 1;
    // Индекс текста в запросе, начиная с нуля.
    int32 index = 2;
    // Вектор в формате, заданном параметром encoding_format: массив чисел для float или строка Base64 для base64.
    google.protobuf.Value embedding = 3;
  }
}

message ListModelsResponse {
  option (openapi.v3.schema) = {example: {yaml:
    "{\n"
    "  \"object\": \"list\",\n"
    "  \"data\": [\n"
    "    {\n"
    "      \"id\": \"gemini-3.1-flash-lite\",\n"
    "      \"object\": \"model\",\n"
    "      \"created\": 1786700481,\n"
    "      \"owned_by\": \"beget\"\n"
    "    },\n"
    "    {\n"
    "      \"id\": \"text-embedding-3-small\",\n"
    "      \"object\": \"model\",\n"
    "      \"created\": 1786700481,\n"
    "      \"owned_by\": \"beget\"\n"
    "    }\n"
    "  ]\n"
    "}"
  }};

  // Тип объекта. Значение: list.
  string object = 1;
  // Список моделей, доступных вашему API-ключу.
  repeated beget.llm_gateway.v1.structures.Model data = 2;
}

message GetModelRequest {
  // Идентификатор модели.
  string model = 1 [(google.api.field_behavior) = REQUIRED, (openapi.v3.property) = {example: {yaml: "gemini-3.1-flash-lite"}}];
}
