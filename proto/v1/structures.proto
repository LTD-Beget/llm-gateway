syntax = "proto3";

package beget.llm_gateway.v1.structures;

import "google/api/field_behavior.proto";
import "openapiv3/annotations.proto";

option go_package = "github.com/LTD-Beget/llm-gateway/proto/v1;llmgateway";

message ChatMessage {
  option (openapi.v3.schema) = {
    properties: {
      additional_properties: {name: "content" value: {schema: {description: "Содержимое сообщения: текст или массив частей, например текста и изображений. Для сообщения assistant с вызовом инструмента может быть null." example: {yaml: "'Описание товара: белая керамическая кружка, 350 мл, можно мыть в посудомоечной машине.'"}}}}
      additional_properties: {name: "tool_calls" value: {schema: {type: "array" items: {schema_or_reference: {schema: {type: "object"}}} description: "Вызовы инструментов, которые вернула модель в предыдущем сообщении assistant."}}}
    }
  };

  // Роль отправителя: system, developer, user, assistant или tool. Доступные роли зависят от модели.
  string role = 1 [(google.api.field_behavior) = REQUIRED, (openapi.v3.property) = {example: {yaml: "user"}}];
  // Имя участника диалога. Позволяет различать сообщения нескольких участников с одинаковой ролью.
  string name = 3;
  // Идентификатор вызова инструмента для сообщения с ролью tool.
  string tool_call_id = 5;
  // Рассуждения модели из предыдущего ответа. Передавайте, если это требуется выбранной моделью.
  string reasoning_content = 6;
}

message TokenUsage {
  option (openapi.v3.schema) = {
    properties: {
      additional_properties: {name: "prompt_tokens_details" value: {schema: {type: "object" description: "Детализация входных токенов, в том числе прочитанных из кэша и записанных в кэш."}}}
      additional_properties: {name: "completion_tokens_details" value: {schema: {type: "object" description: "Детализация выходных токенов, в том числе использованных для рассуждений."}}}
    }
  };

  // Число входных токенов.
  int32 prompt_tokens = 1;
  // Число выходных токенов в ответе модели.
  int32 completion_tokens = 2;
  // Общее число токенов.
  int32 total_tokens = 3;
  // Стоимость запроса в рублях.
  double cost_rub = 6;
  // Цена миллиона входных токенов без кэша в рублях на момент запроса.
  double input_price_per_1m_rub = 7;
  // Цена миллиона выходных токенов в рублях на момент запроса.
  double output_price_per_1m_rub = 8;
  // Цена чтения миллиона токенов из кэша в рублях на момент запроса.
  double cached_price_per_1m_rub = 9;
  // Цена записи миллиона токенов в кэш в рублях на момент запроса.
  double cache_write_price_per_1m_rub = 10;
}

message Model {
  option (openapi.v3.schema) = {example: {yaml:
    "{\n"
    "  \"id\": \"gemini-3.1-flash-lite\",\n"
    "  \"object\": \"model\",\n"
    "  \"created\": 1786700481,\n"
    "  \"owned_by\": \"beget\"\n"
    "}"
  }};

  // Идентификатор модели для параметра model.
  string id = 1;
  // Тип объекта. Значение: model.
  string object = 2;
  // Время создания модели в секундах Unix.
  int64 created = 3 [(openapi.v3.property) = {type: "integer" format: "int64"}];
  // Владелец модели в каталоге шлюза. Значение: beget.
  string owned_by = 4;
}
