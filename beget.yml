name: llm-gateway
caption: ИИ шлюз
title: ИИ шлюз
index: |
  <p>API ИИ шлюза предоставляет методы для генерации ответов на сообщения, получения эмбеддингов текста и списка доступных моделей. Формат запросов и ответов совместим с OpenAI API.</p>
  <p>Для доступа создайте API-ключ в разделе «ИИ шлюз» → «API-ключи» панели управления Beget. Передавайте ключ в заголовке <code>Authorization: Bearer API_KEY</code>.</p>
  <p>Базовый адрес API: <code>https://api-llm.beget.com/v1</code>. Доступные параметры зависят от выбранной модели. Стоимость запросов списывается с баланса Beget в рублях.</p>
  <p><a href="https://beget.com/ru/kb/manual/ai-gateway" target="_blank" rel="noopener">Руководство по ИИ шлюзу</a></p>
hide_sdk: true
openapi:
  info:
    description: Для работы с текстовыми моделями используйте Chat Completions API. Responses API не поддерживается.
    version: v1
  servers:
    - url: https://api-llm.beget.com/v1
  paths:
    /chat/completions:
      post:
        tags:
          - Генерация ответов
        summary: Сгенерировать ответ
        operationId: createChatCompletion
        responses:
          default:
            $ref: '#/components/responses/GatewayError'
    /embeddings:
      post:
        tags:
          - Эмбеддинги
        summary: Создать эмбеддинги
        operationId: createEmbedding
        responses:
          default:
            $ref: '#/components/responses/GatewayError'
    /models:
      get:
        tags:
          - Модели
        summary: Получить список моделей
        operationId: listModels
        responses:
          default:
            $ref: '#/components/responses/GatewayError'
    /models/{model}:
      get:
        tags:
          - Модели
        summary: Получить информацию о модели
        operationId: getModel
        responses:
          default:
            $ref: '#/components/responses/GatewayError'
  components:
    schemas:
      Google_protobuf_ListValue: null
      Gateway_ChatCompletionRequest:
        example:
          model: gemini-3.1-flash-lite
          messages:
            - role: system
              content: Ты редактор интернет-магазина. Напиши ровно одно короткое предложение, не более 20 слов.
                Без вступления, вариантов и форматирования.
            - role: user
              content: 'Описание товара: белая керамическая кружка, 350 мл, можно мыть в посудомоечной машине.'
          max_tokens: 128
        properties:
          model:
            example: gemini-3.1-flash-lite
          messages:
            minItems: 1
          stream:
            example: false
      Gateway_ChatCompletionResponse:
        example:
          id: gen_2224184511775248385
          object: chat.completion
          created: 1792590913
          model: gemini-3.1-flash-lite
          choices:
            - index: 0
              message:
                role: assistant
                content: Классическая белая кружка объемом 350 мл подходит для мытья в посудомоечной машине.
              finish_reason: stop
          usage:
            cache_write_price_per_1m_rub: 10
            cached_price_per_1m_rub: 3
            completion_tokens: 25
            completion_tokens_details:
              audio_tokens: 0
              reasoning_tokens: 0
            cost_rub: 0.00632
            input_price_per_1m_rub: 30
            output_price_per_1m_rub: 176
            prompt_tokens: 64
            prompt_tokens_details:
              audio_tokens: 0
              cache_write_tokens: 0
              cached_tokens: 0
            total_tokens: 89
        properties:
          created:
            type: integer
            format: int64
      Gateway_EmbeddingRequest:
        example:
          model: text-embedding-3-small
          input: Как восстановить пароль от панели управления Beget?
          encoding_format: float
          dimensions: 8
        properties:
          model:
            example: text-embedding-3-small
          input:
            example: Как восстановить пароль от панели управления Beget?
          encoding_format:
            enum:
              - float
              - base64
      Gateway_EmbeddingResponse:
        example:
          data:
            - embedding:
                - 0.2181396484375
                - 0.340576171875
                - -0.2415771484375
                - 0.0113983154296875
                - -0.24951171875
                - 0.322021484375
                - -0.440185546875
                - 0.646484375
              index: 0
              object: embedding
          model: text-embedding-3-small
          object: list
          usage:
            cost_rub: 5.4e-05
            input_price_per_1m_rub: 3
            prompt_tokens: 18
            total_tokens: 18
      Gateway_ListModelsResponse:
        example:
          object: list
          data:
            - id: gemini-3.1-flash-lite
              object: model
              created: 1786700481
              owned_by: beget
            - id: text-embedding-3-small
              object: model
              created: 1786700481
              owned_by: beget
      Google_protobuf_Struct:
        properties: null
        description: Произвольный JSON-объект.
      Google_protobuf_Value:
        type: null
        properties: null
        description: 'Произвольное JSON-значение: строка, число, объект, массив, логическое значение или null.'
      Structures_ChatMessage:
        example:
          role: user
          content: 'Описание товара: белая керамическая кружка, 350 мл, можно мыть в посудомоечной машине.'
        properties:
          role:
            example: user
          content:
            example: 'Описание товара: белая керамическая кружка, 350 мл, можно мыть в посудомоечной машине.'
      Structures_Model:
        example:
          id: gemini-3.1-flash-lite
          object: model
          created: 1786700481
          owned_by: beget
        properties:
          created:
            type: integer
            format: int64
      Structures_TokenUsage:
        example:
          cache_write_price_per_1m_rub: 10
          cached_price_per_1m_rub: 3
          completion_tokens: 25
          completion_tokens_details:
            audio_tokens: 0
            reasoning_tokens: 0
          cost_rub: 0.00632
          input_price_per_1m_rub: 30
          output_price_per_1m_rub: 176
          prompt_tokens: 64
          prompt_tokens_details:
            audio_tokens: 0
            cache_write_tokens: 0
            cached_tokens: 0
          total_tokens: 89
    responses:
      GatewayError:
        description: |-
          Возвращает описание ошибки в поле `error`.

          - `400` - некорректные параметры запроса.
          - `401` - API-ключ недействителен или отключён.
          - `402` - недостаточно средств на балансе или исчерпан бюджет ключа.
          - `404` - модель не найдена или недоступна ключу.
          - `409` - конфликт идемпотентности.
          - `429` - превышен лимит запросов.
          - `5xx` - ошибка шлюза или поставщика модели.
        content:
          application/json:
            schema:
              type: object
              properties:
                error:
                  type: object
                  properties:
                    message:
                      type: string
                    type:
                      type: string
                    param:
                      nullable: true
                      type: string
                    code:
                      type: string
            example:
              error:
                message: invalid api key
                type: invalid_request_error
                param: null
                code: invalid_api_key
    securitySchemes:
      bearerAuth:
        bearerFormat: null
        description: API-ключ ИИ шлюза Beget
  tags:
    - name: Генерация ответов
      description: Генерация ответов модели на основе переданных сообщений.
    - name: Модели
      description: Информация о моделях, доступных вашему API-ключу.
    - name: Эмбеддинги
      description: Векторные представления текста для поиска по смыслу и сравнения текстов.
  externalDocs:
    description: Руководство по ИИ шлюзу
    url: https://beget.com/ru/kb/manual/ai-gateway
