title: "ИИ шлюз"
index: |
  <p>API ИИ шлюза предоставляет методы для генерации ответов на сообщения, получения эмбеддингов текста и списка доступных моделей. Формат запросов и ответов совместим с OpenAI API.</p>
  <p>Для доступа создайте API-ключ в разделе «ИИ шлюз» → «API-ключи» панели управления Beget. Передавайте ключ в заголовке <code>Authorization: Bearer API_KEY</code>.</p>
  <p>Базовый адрес API: <code>https://api-llm.beget.com/v1</code>. Доступные параметры зависят от выбранной модели. Стоимость запросов списывается с баланса Beget в рублях.</p>
  <p><a href="https://beget.com/ru/kb/manual/ai-gateway" target="_blank" rel="noopener">Руководство по ИИ шлюзу</a></p>
